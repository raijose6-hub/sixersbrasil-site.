<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Philadelphia 76ers Brasil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
  [hidden]:not([hidden=until-found i]){display:none!important}
  img{max-width:100%}

  :root {
    --bg: #F4F8FC;
    --surface: #FFFFFF;
    --fg: #0A1F3C;
    --muted: #4C6280;
    --line: #D3E0EE;
    --accent: #006BB6;
    --accent-ink: #FFFFFF;
    --hero-bg: #00468A;
    --hero-fg: #FFFFFF;
    --hero-soft: #B9D6F2;
    --loss: #B5233A;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #061426; --surface: #0C2140; --fg: #EAF2FB; --muted: #9DB5D1; --line: #1B3A63;
      --accent: #4DA3E8; --accent-ink: #04162B; --hero-bg: #0A3466; --hero-fg: #FFFFFF; --hero-soft: #A9CCEE;
      --loss: #FF7D8F; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #061426; --surface: #0C2140; --fg: #EAF2FB; --muted: #9DB5D1; --line: #1B3A63;
    --accent: #4DA3E8; --accent-ink: #04162B; --hero-bg: #0A3466; --hero-fg: #FFFFFF; --hero-soft: #A9CCEE;
    --loss: #FF7D8F; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.55;
    padding-inline: 0; margin: 0;
  }
  a { color: var(--accent); }
  a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap {
    max-width: 980px; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.05; }
  .num { font-variant-numeric: tabular-nums; }

  /* Topo */
  .top { background: var(--hero-bg); color: var(--hero-fg); }
  .bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding-block: 16px 10px; }
  .brand { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 1.7rem; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
  .brand span { color: var(--hero-soft); }
  .stamp { font-size: .8rem; color: var(--hero-soft); }
  .stamp .ig, footer .ig { color: var(--hero-fg); font-weight: 600; }
  nav { display: flex; gap: 4px 18px; flex-wrap: wrap; padding-bottom: 14px; }
  nav a { color: var(--hero-fg); text-decoration: none; font-weight: 600; font-size: .9rem; padding: 4px 0; border-bottom: 2px solid transparent; }
  nav a:hover { border-bottom-color: var(--hero-soft); }

  .next { padding-block: 10px 28px; display: grid; gap: 14px; }
  .eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--hero-soft); }
  .matchup { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .matchup h1 { font-weight: 800; font-style: italic; font-size: clamp(2.4rem, 11vw, 4.6rem); text-transform: uppercase; }
  .matchup .x { font-family: var(--font-display); font-size: 1.6rem; color: var(--hero-soft); }
  .when { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 1.05rem; }
  .when b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
  .record { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pill { border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 4px 12px; font-size: .88rem; }
  .pill b { font-weight: 600; }

  /* Seções */
  main { padding-block: 28px 40px; display: grid; gap: 40px; }
  section { min-width: 0; }
  .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 3px solid var(--accent); padding-bottom: 6px; }
  .sec-title h2 { font-size: 1.9rem; font-weight: 800; text-transform: uppercase; font-style: italic; }
  .sec-title small { color: var(--muted); font-size: .85rem; }

  /* Resultados */
  .results { display: grid; gap: 10px; }
  .game { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; }
  .tag { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 4px; }
  .tag.w { background: var(--accent); color: var(--accent-ink); }
  .tag.l { border: 2px solid var(--loss); color: var(--loss); }
  .game .vs { font-weight: 600; }
  .game .day { color: var(--muted); font-size: .82rem; display: block; font-weight: 400; }
  .game .score { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; white-space: nowrap; }
  .game .best { grid-column: 1 / -1; font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 4px; }
  .game .best b { color: var(--fg); }

  /* Destaques */
  .stars { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .star { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 6px; padding: 14px; min-width: 0; }
  .star h3 { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; }
  .star .role { color: var(--muted); font-size: .82rem; margin-bottom: 10px; }
  .stat-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat b { display: block; font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1; }
  .stat span { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .star p { font-size: .88rem; margin: 10px 0 0; color: var(--muted); }
  .note { font-size: .82rem; color: var(--muted); margin: 10px 0 0; }

  /* Notícias */
  .posts { display: grid; gap: 14px; }
  article { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
  article .meta { font-size: .78rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  article h3 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
  article p { margin: 0 0 10px; max-width: 65ch; }
  article p:last-child { margin-bottom: 0; }
  article.lead { border-left: 6px solid var(--accent); }
  .scroll-x { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  tr.me td { font-weight: 600; color: var(--accent); }
  .out { display: inline-block; border: 1.5px solid var(--loss); color: var(--loss); border-radius: 4px; padding: 0 8px; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  #lesoes td:not(:first-child), #lesoes th:not(:first-child) { text-align: left; }
  .src { font-size: .8rem; color: var(--muted); }

  /* Calendário */
  .sched { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .sched li { display: grid; grid-template-columns: 5.2rem 1fr auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .sched li:last-child { border-bottom: 0; }
  .sched .d { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.1; }
  .sched .d small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .75rem; color: var(--muted); text-transform: uppercase; }
  .sched .ha { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sched .hr { font-weight: 600; white-space: nowrap; }
  details summary { cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
  details[open] summary { margin-bottom: 10px; }

  footer { background: var(--hero-bg); color: var(--hero-soft); font-size: .82rem; padding-block: 22px; }
  footer p { margin: 0 0 6px; max-width: 70ch; }

  @media (min-width: 760px) {
    main { grid-template-columns: 1fr 1fr; gap: 40px 32px; }
    #noticias, #destaques { grid-column: 1 / -1; }
    .posts { grid-template-columns: 1fr 1fr; }
    article.lead { grid-column: 1 / -1; }
  }
